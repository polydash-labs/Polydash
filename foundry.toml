[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
# src/ is kept byte-identical to the verified deployed source (metadata hash).
ignore = ["src/**/*.sol"]

# Fork tests for the creator contracts: deployed Robinhood Chain contracts use PUSH0, so run with cancun.
# FORK_RPC=https://rpc.mainnet.chain.robinhood.com FOUNDRY_PROFILE=fork forge test --match-contract Fork
[profile.fork]
evm_version = "cancun"
