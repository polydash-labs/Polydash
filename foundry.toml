[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
]
# The floor vault and buyback modules were deployed with solc 0.8.26 (exact pragma) and evm cancun, and they
# integrate with Uniswap V4 (transient storage), so tests execute on cancun. The pre-existing modules keep the
# paris target they have always been compiled with. The compiler version follows each file's exact pragma.
additional_compiler_profiles = [{name = "paris", evm_version = "paris"}]
compilation_restrictions = [
    {paths = "src/PolydashStakingFactory.sol", evm_version = "paris"},
    {paths = "src/PolydashStakingPool.sol", evm_version = "paris"},
    {paths = "src/v2/**", evm_version = "paris"},
    {paths = "src/nftstaking/**", evm_version = "paris"},
    {paths = "src/vesting/**", evm_version = "paris"},
    {paths = "src/bond/**", evm_version = "paris"},
    {paths = "src/gatedmint/**", evm_version = "paris"},
    {paths = "src/treasury/**", evm_version = "paris"},
    {paths = "src/floorvault/**", min_evm_version = "cancun"},
    {paths = "src/buyback/**", min_evm_version = "cancun"},
    {paths = "lib/v4-core/**", min_evm_version = "cancun"},
]

[profile.default.fuzz]
runs = 1000

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
# src/ is kept byte-identical to the verified deployed source (metadata hash).
ignore = ["src/**/*.sol"]

# Fork tests for the creator contracts: deployed Robinhood Chain contracts use PUSH0, so run with cancun.
# FORK_RPC=https://rpc.mainnet.chain.robinhood.com FOUNDRY_PROFILE=fork forge test --match-contract Fork
[profile.fork]
evm_version = "cancun"
