name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    name: Foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test
        run: forge test -vvv
      - name: Gas report
        run: forge test --gas-report | tee gas-report.txt
      - name: Gas snapshot
        run: forge snapshot --snap .gas-snapshot
      - name: Coverage
        run: |
          forge coverage --ir-minimum --no-match-coverage "test|script" --report summary --report lcov | tee coverage-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            lcov.info
            coverage-summary.txt
            gas-report.txt
            .gas-snapshot

  fork:
    name: Fork tests (creator contracts)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: fork
      FORK_RPC: https://rpc.mainnet.chain.robinhood.com
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fork tests
        run: |
          if ! cast block-number --rpc-url "$FORK_RPC" >/dev/null 2>&1; then
            echo "Robinhood Chain RPC is not reachable. Skipping fork tests."
            exit 0
          fi
          forge test --match-path "test/fork/*" -vvv

  slither:
    name: Slither (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          fail-on: none
          target: .
          sarif: results.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-sarif
          path: results.sarif

  agents:
    name: Agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest web3 requests
      - name: Lint
        run: ruff check agents script
      - name: Test
        run: pytest -q

  web:
    name: Polypad web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test
        working-directory: polypad/web
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
          yarn install --immutable
          yarn test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: python3 script/scan_secrets.py
